name: build-dist

# Builds the Gradle bin distribution zip for the refs in the matrix and publishes
# each as a release asset (tag: dist-<ref>) so it can be fed into the
# feature-module-3000 sync benchmark as gradle_distribution_url.
on:
  push:
    branches: [ci/build-dist]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        ref: [kotlin-dsl/lazy-configuration-accessors]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 1

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/share/boost /opt/ghc /usr/share/swift \
            "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          docker system prune -af || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build bin distribution
        run: ./gradlew :distributions-full:binDistributionZip --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          zip=$(ls packaging/distributions-full/build/distributions/*-bin.zip)
          sha=$(git rev-parse --short HEAD)
          tag="dist-${{ matrix.ref }}"
          url="https://github.com/${{ github.repository }}/releases/download/$tag/$(basename "$zip")"
          gh release delete "$tag" --yes 2>/dev/null || true
          gh release create "$tag" \
            --title "Gradle bin distribution — ${{ matrix.ref }} @ $sha" \
            --notes "Built from https://github.com/${{ github.repository }}/tree/${{ matrix.ref }} ($sha) via the build-dist workflow." \
            "$zip"
          echo "distribution URL: $url" | tee -a "$GITHUB_STEP_SUMMARY"
